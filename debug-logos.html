<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo Debug Tool</title>
    <style>
        body {
            font-family: system-ui;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .debug-info {
            background: #f3f4f6;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .newspaper-item {
            background: white;
            border: 1px solid #e5e7eb;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
        }
        .newspaper-item img {
            max-width: 200px;
            max-height: 60px;
            display: block;
            margin: 10px 0;
        }
        .error { color: #ef4444; font-weight: bold; }
        .success { color: #10b981; font-weight: bold; }
        .warning { color: #f59e0b; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🔍 Logo Debug Tool</h1>
    <p>This page will check all newspapers and their logos</p>

    <button onclick="checkLogos()" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">
        Check Logos
    </button>

    <div id="results"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    <script src="js/firebase-config.js"></script>

    <script>
        async function checkLogos() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p>Loading newspapers...</p>';

            try {
                const db = firebase.firestore();
                const snapshot = await db.collection('newspapers').get();

                let html = `<div class="debug-info">
                    <h3>Total Newspapers: ${snapshot.size}</h3>
                </div>`;

                let activeCount = 0;
                let withLogos = 0;
                let withoutLogos = 0;

                snapshot.forEach(doc => {
                    const data = doc.data();
                    const isActive = data.active !== false;

                    if (isActive) activeCount++;
                    if (data.logoUrl) withLogos++;
                    else withoutLogos++;

                    html += `
                        <div class="newspaper-item">
                            <h4>${data.name}</h4>
                            <p><strong>ID:</strong> ${doc.id}</p>
                            <p><strong>Language:</strong> ${data.language || 'Not set'}</p>
                            <p><strong>Active:</strong>
                                <span class="${isActive ? 'success' : 'error'}">
                                    ${isActive ? '✓ Yes' : '✗ No'}
                                </span>
                            </p>
                            <p><strong>Logo URL:</strong>
                                ${data.logoUrl ?
                                    `<span class="success">✓ Has logo</span>` :
                                    `<span class="warning">⚠ No logo</span>`
                                }
                            </p>
                            ${data.logoUrl ? `
                                <p><strong>URL:</strong> <code>${data.logoUrl}</code></p>
                                <p><strong>Preview:</strong></p>
                                <img src="${data.logoUrl}" alt="${data.name}"
                                     onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
                                     onload="this.style.display='block'; this.nextElementSibling.style.display='none';">
                                <p style="display:none; color: red;">⚠ Image failed to load</p>
                            ` : ''}
                            ${!isActive ? '<p class="warning">⚠ This newspaper won\'t show in carousel (not active)</p>' : ''}
                        </div>
                    `;
                });

                html = `
                    <div class="debug-info">
                        <h3>Summary</h3>
                        <p><strong>Total Newspapers:</strong> ${snapshot.size}</p>
                        <p><strong>Active Newspapers:</strong> <span class="success">${activeCount}</span></p>
                        <p><strong>With Logos:</strong> <span class="success">${withLogos}</span></p>
                        <p><strong>Without Logos:</strong> <span class="warning">${withoutLogos}</span></p>
                        <p class="warning">⚠ Only <strong>active</strong> newspapers with logos will appear in the carousel</p>
                    </div>
                ` + html;

                resultsDiv.innerHTML = html;

            } catch (error) {
                resultsDiv.innerHTML = `<div class="debug-info error">
                    <h3>Error</h3>
                    <p>${error.message}</p>
                    <p>Check console for details</p>
                </div>`;
                console.error('Error:', error);
            }
        }
    </script>
</body>
</html>
