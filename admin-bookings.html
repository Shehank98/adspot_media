<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Bookings | AdSpot Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/firebase-ui.css">

    <style>
        body {
            background: #f8fafc;
        }

        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 100px 20px 40px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .admin-header h1 {
            font-size: 32px;
            color: var(--text-primary);
        }

        .filter-tabs {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .filter-tab {
            padding: 8px 20px;
            border-radius: 8px;
            border: 1px solid var(--gray-300);
            background: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-tab.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .bookings-table {
            background: white;
            border-radius: 16px;
            border: 1px solid var(--gray-200);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: var(--gray-50);
        }

        th {
            padding: 16px;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 16px;
            border-top: 1px solid var(--gray-200);
        }

        tbody tr {
            transition: background 0.2s;
            cursor: pointer;
        }

        tbody tr:hover {
            background: var(--gray-50);
        }

        .booking-id {
            font-weight: 600;
            color: var(--text-primary);
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            display: inline-block;
        }

        .status-pending {
            background: #fef3c7;
            color: #92400e;
        }

        .status-confirmed {
            background: #dbeafe;
            color: #1e40af;
        }

        .status-completed {
            background: #dcfce7;
            color: #166534;
        }

        .status-cancelled {
            background: #fee2e2;
            color: #991b1b;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 13px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-view {
            background: var(--primary);
            color: white;
        }

        .btn-view:hover {
            background: var(--primary-dark);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 32px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 24px;
        }

        .modal-header h2 {
            font-size: 24px;
            color: var(--text-primary);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .detail-item label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .detail-item p {
            font-size: 15px;
            color: var(--text-primary);
            font-weight: 500;
        }

        .items-section {
            background: var(--gray-50);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .items-section h3 {
            font-size: 16px;
            margin-bottom: 16px;
        }

        .booking-item {
            background: white;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .status-update {
            margin-bottom: 24px;
        }

        .status-update label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .status-update select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--gray-300);
            border-radius: 8px;
            font-size: 14px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-secondary {
            background: var(--gray-200);
            color: var(--text-primary);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state p {
            color: var(--text-secondary);
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--gray-200);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <span class="logo-icon">◈</span>
                <span class="logo-text">AdSpot Admin</span>
            </a>
            <ul class="nav-links">
                <li><a href="admin-bookings.html" class="active">Manage Bookings</a></li>
                <li><a href="admin-publications.html">Publications</a></li>
                <li><a href="index.html">Back to Home</a></li>
            </ul>
            <div class="nav-actions">
                <div id="userMenu" class="user-menu">
                    <img id="userPhoto" class="user-avatar" src="" alt="">
                    <div class="user-dropdown">
                        <div class="user-info">
                            <span id="userName" class="user-name">Admin</span>
                            <span id="userEmail" class="user-email">admin@adspot.lk</span>
                        </div>
                        <div class="dropdown-divider"></div>
                        <button id="logoutBtn" class="dropdown-item">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                                <polyline points="16 17 21 12 16 7"></polyline>
                                <line x1="21" y1="12" x2="9" y2="12"></line>
                            </svg>
                            Sign Out
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="admin-container">
        <div class="admin-header">
            <h1>Manage Bookings</h1>
            <div class="filter-tabs">
                <button class="filter-tab active" data-filter="all">All</button>
                <button class="filter-tab" data-filter="pending">Pending</button>
                <button class="filter-tab" data-filter="confirmed">Confirmed</button>
                <button class="filter-tab" data-filter="completed">Completed</button>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loadingState" class="loading">
            <div class="spinner"></div>
            <p>Loading bookings...</p>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state" style="display: none;">
            <p>No bookings found.</p>
        </div>

        <!-- Bookings Table -->
        <div id="bookingsTable" class="bookings-table" style="display: none;">
            <table>
                <thead>
                    <tr>
                        <th>Booking ID</th>
                        <th>Customer</th>
                        <th>Date</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Payment</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="bookingsTableBody"></tbody>
            </table>
        </div>
    </main>

    <!-- Booking Details Modal -->
    <div id="bookingModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalBookingId">Booking Details</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>

            <div class="detail-grid" id="modalDetails"></div>

            <div class="items-section">
                <h3>Ad Items</h3>
                <div id="modalItems"></div>
            </div>

            <div class="status-update">
                <label>Update Booking Status</label>
                <select id="statusSelect">
                    <option value="pending">Pending</option>
                    <option value="confirmed">Confirmed</option>
                    <option value="completed">Completed</option>
                    <option value="cancelled">Cancelled</option>
                </select>
            </div>

            <div class="status-update">
                <label>Payment Status</label>
                <select id="paymentStatusSelect">
                    <option value="pending">Pending</option>
                    <option value="completed">Paid</option>
                    <option value="failed">Failed</option>
                </select>
            </div>

            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal()">Close</button>
                <button class="btn btn-primary" onclick="updateStatus()">Update Status</button>
                <button class="btn btn-primary" onclick="updatePaymentStatus()">Mark as Paid</button>
                <button class="btn btn-primary" onclick="generateAndSendInvoice()">Generate & Send Invoice</button>
                <button class="btn btn-primary" onclick="downloadInvoice()">Download Invoice</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

    <!-- jsPDF for PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- Firebase Config -->
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/firebase-db.js"></script>
    <script src="js/invoice-pdf.js"></script>

    <script>
        let allBookings = [];
        let currentBooking = null;
        let currentFilter = 'all';

        // Format currency
        function formatCurrency(amount) {
            return `LKR ${amount.toLocaleString('en-LK')}`;
        }

        // Format date
        function formatDate(timestamp) {
            if (!timestamp) return 'N/A';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        // Load all bookings (admin view)
        async function loadBookings() {
            const user = firebase.auth().currentUser;

            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            // Check if user is admin (you can add role check here)
            const userDoc = await db.collection('users').doc(user.uid).get();
            if (userDoc.exists && userDoc.data().role !== 'admin') {
                alert('Access denied. Admin only.');
                window.location.href = 'index.html';
                return;
            }

            const loadingState = document.getElementById('loadingState');
            const emptyState = document.getElementById('emptyState');
            const bookingsTable = document.getElementById('bookingsTable');

            try {
                // Load ALL bookings (admin view)
                const snapshot = await db.collection('bookings').get();

                loadingState.style.display = 'none';

                if (snapshot.empty) {
                    emptyState.style.display = 'block';
                    return;
                }

                // Store all bookings
                allBookings = [];
                snapshot.forEach(doc => {
                    allBookings.push({ id: doc.id, ...doc.data() });
                });

                // Sort by createdAt descending
                allBookings.sort((a, b) => {
                    const timeA = a.createdAt ? a.createdAt.toMillis() : 0;
                    const timeB = b.createdAt ? b.createdAt.toMillis() : 0;
                    return timeB - timeA;
                });

                bookingsTable.style.display = 'block';
                renderBookings();

            } catch (error) {
                console.error('Error loading bookings:', error);
                loadingState.innerHTML = `
                    <p style="color: #ef4444;">Failed to load bookings: ${error.message}</p>
                `;
            }
        }

        // Render bookings based on filter
        function renderBookings() {
            const tbody = document.getElementById('bookingsTableBody');
            tbody.innerHTML = '';

            const filtered = currentFilter === 'all'
                ? allBookings
                : allBookings.filter(b => b.status === currentFilter);

            filtered.forEach(booking => {
                const row = document.createElement('tr');
                row.onclick = () => viewBooking(booking);

                const statusClass = `status-${booking.status || 'pending'}`;
                const statusText = (booking.status || 'pending').charAt(0).toUpperCase() + (booking.status || 'pending').slice(1);

                row.innerHTML = `
                    <td class="booking-id">${booking.bookingId}</td>
                    <td>
                        <div>${booking.customerName}</div>
                        <div style="font-size: 13px; color: var(--text-secondary);">${booking.customerEmail}</div>
                    </td>
                    <td>${formatDate(booking.createdAt)}</td>
                    <td><strong>${formatCurrency(booking.totalAmount)}</strong></td>
                    <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                    <td style="text-transform: capitalize;">${booking.paymentStatus || 'Pending'}</td>
                    <td>
                        <div class="action-buttons">
                            <button class="btn-sm btn-view" onclick="event.stopPropagation(); viewBooking(${JSON.stringify(booking).replace(/"/g, '&quot;')})">View</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        // View booking details
        function viewBooking(booking) {
            currentBooking = booking;
            const modal = document.getElementById('bookingModal');
            const modalBookingId = document.getElementById('modalBookingId');
            const modalDetails = document.getElementById('modalDetails');
            const modalItems = document.getElementById('modalItems');
            const statusSelect = document.getElementById('statusSelect');
            const paymentStatusSelect = document.getElementById('paymentStatusSelect');

            modalBookingId.textContent = booking.bookingId;
            statusSelect.value = booking.status || 'pending';
            paymentStatusSelect.value = booking.paymentStatus || 'pending';

            modalDetails.innerHTML = `
                <div class="detail-item">
                    <label>Customer Name</label>
                    <p>${booking.customerName}</p>
                </div>
                <div class="detail-item">
                    <label>Email</label>
                    <p>${booking.customerEmail}</p>
                </div>
                <div class="detail-item">
                    <label>Phone</label>
                    <p>${booking.customerPhone || 'N/A'}</p>
                </div>
                <div class="detail-item">
                    <label>Company</label>
                    <p>${booking.customerCompany || 'N/A'}</p>
                </div>
                <div class="detail-item">
                    <label>Quotation #</label>
                    <p>${booking.quotationNumber}</p>
                </div>
                <div class="detail-item">
                    <label>Invoice #</label>
                    <p>${booking.invoiceNumber || 'Pending'}</p>
                </div>
                <div class="detail-item">
                    <label>Total Amount</label>
                    <p><strong>${formatCurrency(booking.totalAmount)}</strong></p>
                </div>
                <div class="detail-item">
                    <label>Payment Method</label>
                    <p style="text-transform: capitalize;">${booking.paymentMethod || 'N/A'}</p>
                </div>
            `;

            modalItems.innerHTML = booking.items.map(item => `
                <div class="booking-item">
                    <strong>${item.newspaperName}</strong>
                    <p>${item.adType === 'box' ? 'Box Ad' : 'Classified Ad'} • ${item.pubDate}</p>
                    <p><strong>${formatCurrency(item.price)}</strong></p>
                    ${item.details ? `<p style="font-size: 13px; color: var(--text-secondary);">
                        ${item.adType === 'box' ?
                            `${item.details.columns} col × ${item.details.height} cm (${item.details.colorOption})` :
                            item.details.text || 'N/A'}
                    </p>` : ''}
                </div>
            `).join('');

            modal.classList.add('active');
        }

        // Close modal
        function closeModal() {
            document.getElementById('bookingModal').classList.remove('active');
        }

        // Update booking status
        async function updateStatus() {
            if (!currentBooking) return;

            const newStatus = document.getElementById('statusSelect').value;

            try {
                await db.collection('bookings').doc(currentBooking.id).update({
                    status: newStatus,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert('Status updated successfully!');
                currentBooking.status = newStatus;
                closeModal();
                loadBookings(); // Reload bookings
            } catch (error) {
                console.error('Error updating status:', error);
                alert('Failed to update status: ' + error.message);
            }
        }

        // Update payment status
        async function updatePaymentStatus() {
            if (!currentBooking) return;

            const newPaymentStatus = document.getElementById('paymentStatusSelect').value;

            try {
                await db.collection('bookings').doc(currentBooking.id).update({
                    paymentStatus: newPaymentStatus,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert('Payment status updated successfully!');
                currentBooking.paymentStatus = newPaymentStatus;

                // If marked as paid, generate and send invoice
                if (newPaymentStatus === 'completed') {
                    const shouldGenerateInvoice = confirm('Payment marked as paid. Generate and send invoice to customer?');
                    if (shouldGenerateInvoice) {
                        await generateAndSendInvoice();
                    }
                }

                loadBookings(); // Reload bookings
            } catch (error) {
                console.error('Error updating payment status:', error);
                alert('Failed to update payment status: ' + error.message);
            }
        }

        // Generate invoice and send to customer
        async function generateAndSendInvoice(event) {
            if (!currentBooking) return;

            const btn = event ? event.target : document.querySelector('button[onclick*="generateAndSendInvoice"]');
            btn.disabled = true;
            btn.textContent = 'Generating...';

            try {
                // Check if invoice already exists
                let invoiceNumber = currentBooking.invoiceNumber;

                if (!invoiceNumber) {
                    // Generate new invoice number
                    invoiceNumber = 'INV-' + new Date().toISOString().slice(0,10).replace(/-/g,'') + '-' + Math.floor(Math.random() * 1000).toString().padStart(3, '0');

                    // Update booking with invoice number
                    await db.collection('bookings').doc(currentBooking.id).update({
                        invoiceNumber: invoiceNumber,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }

                // Calculate invoice details
                const subtotal = currentBooking.totalAmount / 1.28; // Reverse calculate (total / 1.28)
                const commission = subtotal * 0.10;
                const vat = subtotal * 0.18;

                // Create/update invoice in Firestore
                const invoiceData = {
                    invoiceNumber: invoiceNumber,
                    quotationNumber: currentBooking.quotationNumber,
                    bookingId: currentBooking.id,
                    customerId: currentBooking.customerId,
                    customerName: currentBooking.customerName,
                    customerEmail: currentBooking.customerEmail,
                    customerPhone: currentBooking.customerPhone || '',
                    customerCompany: currentBooking.customerCompany || '',
                    customerAddress: currentBooking.customerAddress || '',
                    items: currentBooking.items,
                    subtotal: subtotal,
                    commission: commission,
                    vat: vat,
                    total: currentBooking.totalAmount,
                    pdfUrl: '', // Will be updated after PDF generation
                    status: 'generated',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    generatedBy: firebase.auth().currentUser.uid
                };

                await db.collection('invoices').doc(invoiceNumber).set(invoiceData, { merge: true });

                // Generate PDF and upload to Firebase Storage
                try {
                    btn.textContent = 'Generating PDF...';
                    const pdfUrl = await generateInvoicePDF(invoiceData, currentBooking);

                    // Update invoice with PDF URL
                    await db.collection('invoices').doc(invoiceNumber).update({
                        pdfUrl: pdfUrl
                    });

                    invoiceData.pdfUrl = pdfUrl;
                    console.log('✅ Invoice PDF generated:', pdfUrl);
                } catch (pdfError) {
                    console.error('PDF generation error:', pdfError);
                    // Continue even if PDF fails
                }

                // Send invoice email to customer
                try {
                    btn.textContent = 'Sending email...';
                    if (typeof sendInvoiceEmail === 'function') {
                        await sendInvoiceEmail(currentBooking, invoiceData);
                        alert('✅ Invoice generated and sent to: ' + currentBooking.customerEmail + '\n\nPDF available for download.');
                    } else {
                        alert('✅ Invoice generated with PDF.\n\n⚠️ Email function not loaded. Invoice created but not sent.');
                    }
                } catch (emailError) {
                    console.error('Email sending error:', emailError);
                    alert('✅ Invoice generated with PDF but email failed to send.\nInvoice and PDF saved in database.');
                }

                currentBooking.invoiceNumber = invoiceNumber;
                closeModal();
                loadBookings();

            } catch (error) {
                console.error('Error generating invoice:', error);
                alert('Failed to generate invoice: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Generate & Send Invoice';
            }
        }

        // Download invoice
        async function downloadInvoice() {
            if (!currentBooking || !currentBooking.invoiceNumber) {
                alert('No invoice available yet. Generate invoice first.');
                return;
            }

            try {
                const invoiceDoc = await db.collection('invoices').doc(currentBooking.invoiceNumber).get();

                if (invoiceDoc.exists && invoiceDoc.data().pdfUrl) {
                    window.open(invoiceDoc.data().pdfUrl, '_blank');
                } else {
                    alert('Invoice created but PDF not yet uploaded to Google Drive. You can still send the invoice details via email.');
                }
            } catch (error) {
                console.error('Error downloading invoice:', error);
                alert('Failed to download invoice.');
            }
        }

        // Email invoice to customer (placeholder - needs Apps Script)
        async function sendInvoiceEmail(booking, invoice) {
            // This will be handled by firebase-db.js sendBookingEmails function
            // For now, just log that email should be sent
            console.log('Email should be sent to:', booking.customerEmail);
            console.log('Invoice details:', invoice);

            // TODO: Integrate with Apps Script or email service
            // await fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify({...}) });
        }

        // Filter tabs
        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                renderBookings();
            });
        });

        // Wait for auth
        firebase.auth().onAuthStateChanged(user => {
            if (user) {
                loadBookings();
            } else {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
