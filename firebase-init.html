<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

        }

            overflow-y: auto;
        }
        .log-item {
            padding: 8px 12px;
            margin: 5px 0;
            border-radius: 6px;

            font-family: 'Courier New', monospace;
        }
        .log-item.info {
            background: #dbeafe;
            color: #1e40af;
        }
        .log-item.success {
            background: #dcfce7;
            color: #166534;
        }
        .log-item.error {
            background: #fee2e2;
            color: #991b1b;
        }
        .log-item.warning {
            background: #fef3c7;
            color: #92400e;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            margin-bottom: 10px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-secondary {
            background: #64748b;
            margin-top: 10px;
        }
        .btn-secondary:hover {
            box-shadow: 0 10px 25px rgba(100, 116, 139, 0.4);
        }
        .preview {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            font-size: 12px;
        }
        .preview h3 {
            font-size: 14px;
            color: #475569;
            margin-bottom: 10px;
        }
        .preview-item {
            background: white;
            padding: 8px 10px;
            margin: 5px 0;
            border-radius: 4px;
            border-left: 3px solid #3b82f6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 Firebase Database Initializer</h1>
        <p class="subtitle">One-click setup for AdSpot Media newspaper database</p>

        <div class="status" id="statusLog">
            <div class="log-item info">Ready to initialize database...</div>
            <div class="log-item warning">⚠️ Make sure you've configured firebase-config.js first!</div>
        </div>

        <button class="btn" id="initBtn" onclick="initializeDatabase()">
            🚀 Initialize Database
        </button>

        <button class="btn btn-secondary" onclick="showPreview()">
            👁️ Preview Newspapers Data
        </button>

        <div class="preview" id="preview" style="display: none;"></div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        // Initialize Firebase directly (without loading full firebase-config.js)
        const firebaseConfig = {
            apiKey: "AIzaSyC-3O50ecypPkYwp6bOt8qfjegvBjDmQpQ",
            authDomain: "adspot-b44ef.firebaseapp.com",
            projectId: "adspot-b44ef",
            storageBucket: "adspot-b44ef.firebasestorage.app",
            messagingSenderId: "810904997217",
            appId: "1:810904997217:web:3a85856521cac0177dc920"
        };

        // Initialize Firebase
        try {
            firebase.initializeApp(firebaseConfig);
            console.log('✅ Firebase initialized');
        } catch (error) {
            console.error('❌ Firebase init error:', error);
        }

        // Initialize only Firestore (no auth or storage needed for this tool)
        const db = firebase.firestore();
        window.db = db;
    </script>

            { id: 'sunday-times', name: 'Sunday Times', language: 'english', groupName: 'Wijeya Newspapers', bwRate: 650, colorRate: 790, classifiedBase: 500, classifiedFreeWords: 15, classifiedExtraRate: 20, isSundayPaper: true, active: true },
            { id: 'daily-mirror', name: 'Daily Mirror', language: 'english', groupName: 'Wijeya Newspapers', bwRate: 490, colorRate: 580, classifiedBase: 200, classifiedFreeWords: 15, classifiedExtraRate: 15, isSundayPaper: false, active: true },

            { id: 'ceylon-today', name: 'Daily Ceylon Today', language: 'english', groupName: 'Mawbima Group', bwRate: 300, colorRate: 450, classifiedBase: 0, classifiedFreeWords: 0, classifiedExtraRate: 0, isSundayPaper: false, active: true },
            { id: 'sunday-ceylon-today', name: 'Sunday Ceylon Today', language: 'english', groupName: 'Mawbima Group', bwRate: 450, colorRate: 600, classifiedBase: 0, classifiedFreeWords: 0, classifiedExtraRate: 0, isSundayPaper: false, active: true },

            // Liberty Publication
            { id: 'sunday-aruna', name: 'Sathi aga Aruna', language: 'sinhala', groupName: 'Liberty Publication', bwRate: 780, colorRate: 1260, classifiedBase: 990, classifiedFreeWords: 15, classifiedExtraRate: 50, isSundayPaper: true, active: true },
            { id: 'the-morning', name: 'The Morning', language: 'english', groupName: 'Liberty Publication', bwRate: 510, colorRate: 620, classifiedBase: 0, classifiedFreeWords: 0, classifiedExtraRate: 0, isSundayPaper: false, active: true }
        ];

        function log(message, type = 'info') {
            const statusLog = document.getElementById('statusLog');
            const logItem = document.createElement('div');
            logItem.className = `log-item ${type}`;
            logItem.textContent = message;
            statusLog.appendChild(logItem);
            statusLog.scrollTop = statusLog.scrollHeight;
        }

        function showPreview() {
            const preview = document.getElementById('preview');
            const isVisible = preview.style.display !== 'none';

            if (isVisible) {
                preview.style.display = 'none';
                return;
            }

            preview.innerHTML = `
                <h3>📰 ${newspapersData.length} Newspapers will be added:</h3>
                ${newspapersData.map(paper => `
                    <div class="preview-item">
                        <strong>${paper.name}</strong> (${paper.language}) -
                        ${paper.frequency} -
                        Rate: LKR ${paper.baseRate} -
                        Color: +LKR ${paper.colorCharge}
                    </div>
                `).join('')}
            `;
            preview.style.display = 'block';
        }

        async function initializeDatabase() {
            const btn = document.getElementById('initBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Initializing...';

            try {
                // Check if Firebase is configured
                if (typeof firebase === 'undefined') {
                    throw new Error('Firebase SDK not loaded');
                }

                // Use the correct exported variable name
                const db = window.firebaseDB || window.db;

                if (typeof db === 'undefined' || !db) {
                    throw new Error('Firebase not configured. Please update firebase-config.js first!');
                }

                log('🔥 Connected to Firebase', 'success');
                log(`📝 Adding ${newspapersData.length} newspapers...`, 'info');

                let successCount = 0;
                let errorCount = 0;

                // Add each newspaper to Firestore
                for (const newspaper of newspapersData) {
                    try {
                        await db.collection('newspapers').doc(newspaper.id).set({
                            ...newspaper,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        log(`✅ Added: ${newspaper.name}`, 'success');
                        successCount++;
                    } catch (error) {
                        log(`❌ Failed: ${newspaper.name} - ${error.message}`, 'error');
                        errorCount++;
                    }
                }

                log('', 'info');
                log(`🎉 Database initialization complete!`, 'success');
                log(`✅ Success: ${successCount} newspapers`, 'success');
                if (errorCount > 0) {
                    log(`❌ Failed: ${errorCount} newspapers`, 'error');
                }
                log('', 'info');
                log('💡 You can now close this page and refresh your app', 'info');

                btn.textContent = '✅ Initialization Complete';
                btn.style.background = '#10b981';

            } catch (error) {
                log(`❌ Fatal Error: ${error.message}`, 'error');
                log('', 'info');
                log('🔍 Troubleshooting:', 'warning');
                log('1. Check firebase-config.js is properly configured', 'warning');
                log('2. Verify your Firebase project exists', 'warning');
                log('3. Check browser console for detailed errors', 'warning');

                btn.textContent = '❌ Initialization Failed';
                btn.style.background = '#ef4444';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
