<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Under Maintenance | AdSpot Media</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- SEO: Tell search engines this is temporary -->
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="refresh" content="600"> <!-- Auto-refresh every 10 minutes -->

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #06b6d4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Animated floating particles */
        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        .maintenance-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 50px 40px;
            max-width: 550px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 1;
            animation: fadeInScale 0.8s ease;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .logo-container {
            margin-bottom: 20px;
            animation: slideDown 1s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }

        .icon-wrapper {
            margin: 15px 0 25px;
            animation: pulse 2s ease-in-out infinite;
        }

        .icon {
            font-size: 70px;
            display: inline-block;
            filter: drop-shadow(0 10px 20px rgba(59, 130, 246, 0.3));
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        h1 {
            font-size: 36px;
            color: #1e3a8a;
            margin-bottom: 20px;
            font-weight: 800;
            animation: fadeIn 1.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .typewriter-container {
            min-height: 70px;
            margin-bottom: 25px;
        }

        .typewriter-text {
            font-size: 16px;
            color: #475569;
            line-height: 1.7;
            font-weight: 500;
            display: inline;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 20px;
            background-color: #3b82f6;
            margin-left: 2px;
            animation: blink 0.7s infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 14px;
            margin: 25px 0;
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
            animation: slideUp 1s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            animation: statusPulse 2s ease-in-out infinite;
        }

        @keyframes statusPulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.3);
                opacity: 0.7;
            }
        }

        .progress-bar {
            width: 100%;
            height: 5px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            margin: 25px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #06b6d4, #3b82f6);
            background-size: 200% 100%;
            border-radius: 10px;
            animation: shimmer 2s linear infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }

        .info-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 30px 0;
        }

        .info-card {
            background: linear-gradient(135deg, #f8fafc, #e2e8f0);
            padding: 18px 15px;
            border-radius: 14px;
            transition: all 0.3s;
            animation: fadeInUp 1.5s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .info-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .info-card-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .info-card-text {
            font-size: 12px;
            color: #64748b;
            font-weight: 600;
        }

        .contact-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #e2e8f0;
            animation: fadeIn 2s ease;
        }

        .contact-title {
            font-size: 15px;
            color: #475569;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .contact-links {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .contact-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 11px 22px;
            background: white;
            color: #1e3a8a;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
            border: 2px solid #e2e8f0;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .contact-btn:hover {
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            color: white;
            border-color: #3b82f6;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
        }

        .footer-text {
            margin-top: 28px;
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.7;
        }

        .brand-name {
            color: #1e3a8a;
            font-weight: 800;
        }

        /* Admin Access Button (hidden) */
        .admin-access {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.3s;
            z-index: 100;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .admin-access:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.15) rotate(15deg);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .maintenance-container {
                padding: 35px 25px;
                max-width: 100%;
            }

            .logo {
                font-size: 18px;
            }

            h1 {
                font-size: 28px;
            }

            .icon {
                font-size: 60px;
            }

            .typewriter-text {
                font-size: 15px;
            }

            .typewriter-container {
                min-height: 60px;
            }

            .status-badge {
                font-size: 13px;
                padding: 10px 20px;
            }

            .info-cards {
                grid-template-columns: 1fr;
                gap: 10px;
                margin: 25px 0;
            }

            .info-card {
                padding: 16px;
            }

            .contact-links {
                flex-direction: column;
                gap: 10px;
            }

            .contact-btn {
                width: 100%;
                justify-content: center;
            }

            .footer-text {
                font-size: 12px;
            }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            .maintenance-container {
                max-width: 520px;
            }
        }

        @media (max-width: 480px) {
            .maintenance-container {
                padding: 24px 16px;
            }

            h1 {
                font-size: 22px;
            }

            .icon {
                font-size: 48px;
            }

            .contact-btn {
                font-size: 14px;
                padding: 12px 16px;
            }

            .footer-text {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <!-- Hidden admin access button -->

    <script>
        // Create floating particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 30;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';

                const size = Math.random() * 60 + 20;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                particle.style.animationDelay = Math.random() * 5 + 's';

                particlesContainer.appendChild(particle);
            }
        }

        // Typewriter effect
        function typeWriter() {
            const messages = [
                "We're currently upgrading our systems to serve you better.",
                "Our team is working hard to bring you an amazing experience.",
                "New features and improvements are on the way!",
                "Thank you for your patience while we make things better."
            ];

            let messageIndex = 0;
            let charIndex = 0;
            let isDeleting = false;
            const typeSpeed = 50;
            const deleteSpeed = 30;
            const pauseTime = 3000;

            function type() {
                const currentMessage = messages[messageIndex];
                const typewriterElement = document.getElementById('typewriter');

                if (!isDeleting) {
                    typewriterElement.textContent = currentMessage.substring(0, charIndex + 1);
                    charIndex++;

                    if (charIndex === currentMessage.length) {
                        setTimeout(() => {
                            isDeleting = true;
                            type();
                        }, pauseTime);
                        return;
                    }
                } else {
                    typewriterElement.textContent = currentMessage.substring(0, charIndex);
                    charIndex--;

                    if (charIndex === 0) {
                        isDeleting = false;
                        messageIndex = (messageIndex + 1) % messages.length;
                    }
                }

                setTimeout(type, isDeleting ? deleteSpeed : typeSpeed);
            }

            type();
        }

        // Admin access prompt
        function showAdminPrompt() {
            const password = prompt('🔐 Enter admin access code:');
            if (password === 'adspot2026') {
                localStorage.setItem('admin_access', 'true');
                window.location.href = '/';
            } else if (password !== null) {
                alert('❌ Invalid access code');
            }
        }

        // Initialize on load
        window.onload = function() {
            // Check for admin access
            if (localStorage.getItem('admin_access') === 'true') {
                window.location.href = '/';
            }

            // Start animations
            createParticles();
            typeWriter();
        };

        // Auto-refresh page every 10 minutes to check if maintenance is over
        setTimeout(() => {
            window.location.reload();
        }, 10 * 60 * 1000);
    </script>
